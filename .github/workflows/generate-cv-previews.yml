name: Generar miniaturas de CV para la rama de auditoría

on:
  push:
    branches: ['test/qa-responsive-final-2026-11']
    paths: ['.github/workflows/generate-cv-previews.yml']

permissions:
  contents: write

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/qa-responsive-final-2026-11
          persist-credentials: true
      - name: Crear vistas previas exactas desde PDF
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          mkdir -p public/cv/previews
          pdftoppm -f 1 -l 1 -singlefile -scale-to 820 -png public/cv/CV_Maycol_Melgarejo_Frontend.pdf public/cv/previews/frontend
          pdftoppm -f 1 -l 1 -singlefile -scale-to 820 -png public/cv/CV_Maycol_Melgarejo_Backend.pdf public/cv/previews/backend
          pdftoppm -f 1 -l 1 -singlefile -scale-to 820 -png public/cv/CV_Maycol_Melgarejo_Full_Stack.pdf public/cv/previews/fullstack
          file public/cv/previews/*.png
          git add public/cv/previews/
          if git diff --cached --quiet; then
            echo "Las miniaturas ya están actualizadas"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "assets(cv): generar vistas previas fieles a los PDF"
          git push origin HEAD:refs/heads/test/qa-responsive-final-2026-11
