name: Auditoría de accesibilidad WCAG

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/qa-accessibility.mjs'
      - '.github/workflows/accessibility.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/qa-accessibility.mjs'
      - '.github/workflows/accessibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wcag:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependencias de navegador y accesibilidad
        run: |
          npm ci --legacy-peer-deps
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.56.1 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Compilar
        run: npm run build
      - name: Iniciar compilación
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/preview-a11y.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/preview-a11y.log
          exit 1
      - name: Analizar accesibilidad en Chromium
        run: node scripts/qa-accessibility.mjs
      - name: Conservar diagnóstico WCAG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-accesibilidad-wcag
          path: qa-accessibility/wcag.json
          if-no-files-found: warn
          retention-days: 14
