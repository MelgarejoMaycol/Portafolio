name: Auditoría de accesibilidad WCAG

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/qa-accessibility.mjs'
      - '.github/workflows/accessibility.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/qa-accessibility.mjs'
      - '.github/workflows/accessibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wcag:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependencias de navegador y accesibilidad
        run: |
          npm ci --legacy-peer-deps
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.56.1 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Compilar
        run: npm run build
      - name: Iniciar compilación
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/preview-a11y.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/preview-a11y.log
          exit 1
      - name: Analizar accesibilidad en Chromium
        run: node scripts/qa-accessibility.mjs
      - name: Conservar resultado del build local
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp qa-accessibility/wcag.json qa-accessibility/wcag-local.json

      - name: Esperar publicación de los estilos de contraste corregidos
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsSL --max-time 20 https://melgarejomaycol.vercel.app/ -o /tmp/portfolio-public.html; then
              asset=$(grep -oE '/assets/index-[^"]+[.]css' /tmp/portfolio-public.html | head -n 1 || true)
              if test -n "$asset" &&
                 curl -fsSL --max-time 20 "https://melgarejomaycol.vercel.app$asset" -o /tmp/portfolio-public.css &&
                 grep -Fiq '#8ac6ff' /tmp/portfolio-public.css; then
                echo "Estilos accesibles confirmados en el dominio público: $asset"
                exit 0
              fi
            fi
            echo "Esperando publicación de los estilos accesibles ($i/30)"
            sleep 6
          done
          echo "No se pudo confirmar el estilo accesible en la página pública"
          exit 1

      - name: Analizar WCAG directamente en Vercel publicado
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          QA_BASE_URL: https://melgarejomaycol.vercel.app
        run: |
          node scripts/qa-accessibility.mjs
          mv qa-accessibility/wcag.json qa-accessibility/wcag-production.json

      - name: Conservar diagnóstico WCAG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-accesibilidad-wcag
          path: qa-accessibility/
          if-no-files-found: warn
          retention-days: 14
