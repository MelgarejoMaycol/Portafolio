name: Split portfolio certificates

on:
  push:
    paths:
      - ".github/workflows/split-certificates.yml"

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Split certificates PDF
        run: |
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader, PdfWriter
          import re, json

          src = Path("src/assets/Certificados.pdf")
          out = Path("certificados_split")
          out.mkdir(exist_ok=True)

          reader = PdfReader(str(src))
          manifest = []
          for i, page in enumerate(reader.pages, start=1):
              text = (page.extract_text() or "").replace("\n", " ")
              text = re.sub(r"\s+", " ", text).strip()
              writer = PdfWriter()
              writer.add_page(page)
              filename = f"certificado_{i:02d}.pdf"
              with open(out / filename, "wb") as f:
                  writer.write(f)
              manifest.append({
                  "page": i,
                  "file": filename,
                  "text": text[:2000],
              })

          (out / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(f"Split {len(reader.pages)} pages")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: certificados-split
          path: certificados_split/
          if-no-files-found: error
