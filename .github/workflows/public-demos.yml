name: Comprobar demos públicas

on:
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar enlaces y respuesta básica
        run: node scripts/check-public-demos.mjs
