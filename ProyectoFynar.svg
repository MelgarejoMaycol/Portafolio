<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Fynar — plataforma de finanzas personales</title>
  <desc id="desc">Vista conceptual de un dashboard financiero de Fynar con tarjetas de resumen y gráfico.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071623"/>
      <stop offset="0.55" stop-color="#0a2630"/>
      <stop offset="1" stop-color="#103c3c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#34d3b5"/>
      <stop offset="1" stop-color="#7ae7d1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".30"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1050" cy="40" r="280" fill="#38d9b7" opacity=".08"/>
  <circle cx="100" cy="650" r="300" fill="#2d8cff" opacity=".06"/>

  <g transform="translate(72 74)">
    <circle cx="38" cy="38" r="38" fill="#34d3b5" opacity=".16"/>
    <path d="M18 45c11-23 28-28 48-14-9 5-15 12-18 23-11-9-20-10-30-9z" fill="url(#accent)"/>
    <text x="94" y="54" fill="#f4fffd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="56" font-weight="650" letter-spacing="-2">Fynar</text>
    <text x="96" y="88" fill="#9ecbc3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Finanzas personales, más claras.</text>
  </g>

  <g transform="translate(70 200)" filter="url(#shadow)">
    <rect width="1060" height="390" rx="28" fill="#0b1724" stroke="#244352" stroke-width="2"/>
    <rect x="0" y="0" width="210" height="390" rx="28" fill="#0a2029"/>
    <rect x="185" y="0" width="25" height="390" fill="#0a2029"/>

    <rect x="28" y="36" width="154" height="15" rx="7.5" fill="#34d3b5" opacity=".85"/>
    <rect x="28" y="84" width="118" height="12" rx="6" fill="#648691" opacity=".6"/>
    <rect x="28" y="122" width="132" height="12" rx="6" fill="#648691" opacity=".45"/>
    <rect x="28" y="160" width="100" height="12" rx="6" fill="#648691" opacity=".45"/>
    <rect x="28" y="198" width="126" height="12" rx="6" fill="#648691" opacity=".45"/>
    <rect x="28" y="236" width="110" height="12" rx="6" fill="#648691" opacity=".45"/>

    <text x="250" y="58" fill="#f5fffd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="650">Resumen financiero</text>
    <text x="250" y="87" fill="#819ca8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Tu situación financiera en un solo lugar</text>

    <g transform="translate(250 116)">
      <rect width="230" height="92" rx="16" fill="#112735" stroke="#214653"/>
      <text x="18" y="29" fill="#8da8b2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Saldo disponible</text>
      <text x="18" y="66" fill="#f5fffd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">$ 4.820.000</text>

      <rect x="252" width="230" height="92" rx="16" fill="#112735" stroke="#214653"/>
      <text x="270" y="29" fill="#8da8b2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Presupuesto</text>
      <text x="270" y="66" fill="#7ae7d1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">72%</text>

      <rect x="504" width="230" height="92" rx="16" fill="#112735" stroke="#214653"/>
      <text x="522" y="29" fill="#8da8b2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Por pagar</text>
      <text x="522" y="66" fill="#f5fffd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">$ 860.000</text>
    </g>

    <g transform="translate(250 235)">
      <rect width="734" height="118" rx="18" fill="#0e2230" stroke="#1d3d4b"/>
      <text x="18" y="27" fill="#8da8b2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Evolución del mes</text>
      <path d="M25 91 C90 72 124 85 180 58 S286 80 350 43 S450 61 520 32 S625 50 706 22" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
      <path d="M25 91 C90 72 124 85 180 58 S286 80 350 43 S450 61 520 32 S625 50 706 22 L706 105 L25 105 Z" fill="#34d3b5" opacity=".07"/>
      <circle cx="706" cy="22" r="7" fill="#7ae7d1"/>
    </g>
  </g>

  <text x="70" y="638" fill="#95b7b2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">React · TypeScript · Node.js · Express · PostgreSQL · Prisma</text>
</svg>
